<!doctype html>
<html lang="he" dir="rtl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>תצוגה מקדימה של תנועת תמרור עצור</title>
		<style>
			:root {
				color-scheme: light;
				--sign-size: min(clamp(160px, 30vw, 280px), 45svh);
				/* Whole-loop speed: lower duration = faster throughout. */
				--loop-duration: 3s;
				--ease-out: cubic-bezier(0.23, 1, 0.32, 1);
			}

			body {
				margin: 0;
				background: #fff;
			}

			.stage {
				position: relative;
				height: 100svh;
				overflow: hidden;
			}

			.sign {
				position: absolute;
				left: calc(50% - var(--sign-size) / 2);
				top: calc(50% - var(--sign-size) / 2);
				width: var(--sign-size);
				height: var(--sign-size);
				transform-origin: bottom center;
			}

			.stop-dot {
				position: absolute;
				left: calc(50% - 5px);
				top: calc(50% + var(--sign-size) / 2 + 10px);
				width: 10px;
				height: 10px;
				border-radius: 50%;
				background: #000;
			}

			@media (prefers-reduced-motion: no-preference) {
				.sign {
					animation: enter-and-correct var(--loop-duration) linear infinite;
				}
			}

			@keyframes enter-and-correct {
				/* Empty stage, then travel from fully beyond the left edge. */
				0%, 8% {
					transform: translateX(calc(-50vw - var(--sign-size))) rotate(-20deg);
					opacity: 1;
				}
				/* Travel slightly past the dot while still leaning left. */
				40% {
					transform: translateX(10%) rotate(-20deg);
					animation-timing-function: var(--ease-out);
				}
				/* Right tilt reached after 180ms; final correction starts here. */
				46% {
					transform: translateX(6%) rotate(8deg);
					animation-timing-function: var(--ease-out);
				}
				/* FINAL CORRECTION SPEED: change 48% below, keeping 92% fixed.
				   Starts at 46%. With the saved 3s loop, each 1% takes 30ms:
				   48% = 60ms, 49% = 90ms, 50% = 120ms, 52% = 180ms.
				   Keep the endpoint above 46% and below 92%. */
				48%, 92% {
					transform: translateX(0) rotate(0deg);
					opacity: 1;
				}
				/* Fade only to reset the preview, without sliding backward. */
				98%, 100% {
					transform: translateX(0) rotate(0deg);
					opacity: 0;
				}
			}
		</style>
	</head>
	<body>
		<!-- Temporary motion study. Open directly or through the local server. -->
		<main class="stage" aria-label="תמרור עצור נכנס משמאל, מתיישר ומתקן את ההטיה">
			<span class="stop-dot" aria-hidden="true"></span>
			<img class="sign" src="assets/images/stop-sign.png" width="1254" height="1254" alt="תמרור עצור" draggable="false" />
		</main>
	</body>
</html>
