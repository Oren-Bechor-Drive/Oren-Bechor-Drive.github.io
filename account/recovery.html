<!doctype html>
<html lang="he" dir="rtl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
		<meta name="referrer" content="no-referrer" />
		<meta name="robots" content="noindex" />
		<title>שכחתם את הסיסמה? - נהיגה נכונה עם אורן בכור</title>
		<meta name="description" content="הזינו את כתובת האימייל של החשבון ונשלח קישור לאיפוס." />
		<link rel="icon" href="../assets/images/optimized/favicon.png?v=2" type="image/png" />
		<link rel="preload" href="../assets/fonts/varela-round-v21-hebrew.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="../assets/fonts/varela-round-v21-latin.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="../css/base.css" />
		<link rel="stylesheet" href="account.css" />
		<script type="module" src="account.js"></script>
	</head>
	<body data-account="recovery">
		<a class="skip-link" href="#main">דילוג לתוכן</a>
		<main id="main" class="account-shell" tabindex="-1">
			<a class="account-back" href="../index.html">חזרה לדף הבית</a>
			<section class="account-card" aria-labelledby="account-heading">
				<h1 id="account-heading">שכחתם את הסיסמה?</h1>
				<p class="account-intro">הזינו את כתובת האימייל של החשבון ונשלח קישור לאיפוס.</p>
				<noscript><p class="account-feedback">כדי להתחבר לחשבון יש להפעיל JavaScript בדפדפן.</p></noscript>
				<p class="account-feedback" role="alert" tabindex="-1" hidden></p>
				<p class="account-feedback" role="status" aria-live="polite" hidden></p>
				<button class="account-action account-action-secondary account-retry" type="button" data-retry hidden>ניסיון נוסף</button>
				<form data-account-form>
					<fieldset class="account-fields">
						<div class="account-field">
						<label for="email">כתובת אימייל</label>
						<input id="email" name="email" type="email" dir="ltr" autocomplete="email" inputmode="email" maxlength="254" required spellcheck="false" autocapitalize="none" />
					</div>
						<button class="account-action" type="submit" disabled>שליחת קישור לאיפוס</button>
					</fieldset>
				</form><p class="account-links"><a href="login.html">חזרה לכניסה לחשבון</a></p>
			</section>
			<p class="account-footer">נהיגה נכונה עם אורן בכור</p>
		</main>
	</body>
</html>
